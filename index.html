<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXE Fine Fragrance - Signature Scent Finder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        :root { --axe-black: #000; --axe-accent: #d4af37; --ease: cubic-bezier(0.19, 1, 0.22, 1); }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; color: #ffffff !important; }
        
        body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-container { width: 100%; max-width: 420px; height: 100vh; max-height: 850px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #000; }
        
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('start-background.png'); z-index: 1; }
        .view { display: none; flex-direction: column; height: 100%; padding: 2.5rem 2rem; z-index: 10; animation: slideIn 0.8s var(--ease) forwards; }
        .view.active { display: flex; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { font-size: 2.2rem; line-height: 1; font-weight: 900; text-transform: uppercase; margin-bottom: 1rem; text-align: center; }
        h2 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; margin-bottom: 2rem; text-align: center; }
        
        button { width: 100%; padding: 1.1rem; border: none; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .primary-btn { background: #fff !important; color: #000 !important; margin-bottom: 1rem; }
        .option-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); margin-bottom: 0.8rem; text-align: center; }
        
        #results-view { padding: 0; justify-content: flex-start; align-items: center; }
        .res-img-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #res-img { width: 100%; height: 100%; object-fit: contain; }
        .res-content { position: relative; z-index: 2; padding: 4rem 2rem; text-shadow: 0 0 30px #000; width: 100%; text-align: center; }

        #prize-modal { position: absolute; bottom: -110%; left: 0; width: 100%; height: auto; background: linear-gradient(to top, #000 90%, transparent); z-index: 50; padding: 2rem; transition: bottom 1s var(--ease); display: flex; flex-direction: column; align-items: center; }
        #prize-modal.active { bottom: 0; }
        .platform-btn { background: #d4af37 !important; color: #000 !important; font-weight: 900; margin-bottom: 0.8rem; letter-spacing: 2px; }

        #qr-view { position: absolute; top: 100%; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; transition: top 0.6s var(--ease); padding: 3rem 2rem; display: flex; flex-direction: column; align-items: center; }
        #qr-view.active { top: 0; }
        #qrcode { background: #fff; padding: 10px; border-radius: 5px; margin: 2rem 0; }
        #qrcode * { color: #000 !important; }
    </style>
</head>
<body>
    <main id="game-container">
        <div class="bg-layer"></div>
        <section id="screensaver" class="view active" style="background-image:url('holding-screen.png'); background-size:cover;"></section>
        <section id="start-view" class="view" style="justify-content:center; align-items:center;">
            <img src="logo.png" style="width:50%; margin-bottom:2rem;">
            <h1>FIND YOUR<br>SIGNATURE SCENT</h1>
            <button id="start-btn" class="primary-btn">START EXPERIENCE</button>
        </section>
        <section id="quiz-view" class="view" style="justify-content:center;"><h2 id="q-text"></h2><div id="opts-container"></div></section>
        <section id="results-view" class="view">
            <div class="res-img-wrap"><img id="res-img" src=""></div>
            <div class="res-content">
                <h3 style="color:var(--axe-accent) !important; letter-spacing:3px; font-size:0.7rem; margin-bottom:10px;">MATCHED SCENT:</h3>
                <h1 id="res-title"></h1>
                <p id="res-desc" style="font-size:0.8rem; opacity:0.8;"></p>
            </div>
            <div id="prize-modal">
                <div style="background:var(--axe-accent); color:#000 !important; padding:0.2rem 1rem; font-weight:900; font-size:0.7rem; margin-bottom:1rem;">GRAND PRIZE ENTRY</div>
                <h2 style="font-size:1.2rem; margin-bottom:1.5rem;">POST YOUR SCENT TO ENTER THE DRAW</h2>
                <button class="platform-btn" onclick="generateQR()">POST TO SOCIALS</button>
            </div>
            <div id="qr-view">
                <h2 id="qr-title" style="color:var(--axe-accent) !important;">SCAN TO POST</h2>
                <div id="qrcode"></div>
                <p style="font-weight:900; font-size:0.8rem; text-align:center;">WIN AN ULTRA VIP EXPERIENCE</p>
                <button onclick="document.getElementById('qr-view').classList.remove('active')" style="background:none; border:none; color:#fff; margin-top:auto; font-size:0.7rem; text-decoration:underline;">BACK</button>
            </div>
        </section>
    </main>
    <script>
        const BASE_URL = "https://milanerasmus.github.io/axe-scent-finder"; 
        const outcomes = {
            aquaBergamot: { t: "AQUA BERGAMOT", f: "aqua.png", d: "Fresh. Clean. Sharply modern." },
            blueLavender: { t: "BLUE LAVENDER", f: "lavender.png", d: "Cool. Smooth. Understated." },
            whiteOak: { t: "WHITE OAK", f: "oak.png", d: "Refined. Airy. Elevated." },
            blackVanilla: { t: "BLACK VANILLA", f: "vanilla.png", d: "Warm. Smooth. Addictive." },
            copperSantal: { t: "COPPER SANTAL", f: "copper.png", d: "Bold. Spiced. Distinct." }
        };
        const questionsList = [
            { q: "What’s your signature vibe?", options: [ { t: "The Tastemaker", s: "whiteOak" }, { t: "The Minimalist", s: "aquaBergamot" }, { t: "The Social Operator", s: "blueLavender" }, { t: "The Explorer", s: "copperSantal" }, { t: "The Creative", s: "blackVanilla" } ] },
            { q: "Pick your ideal SA getaway?", options: [ { t: "Clifton Villa", s: "whiteOak" }, { t: "Kruger Lodge", s: "copperSantal" }, { t: "Winelands Estate", s: "blueLavender" }, { t: "Ballito Beach", s: "aquaBergamot" }, { t: "Franschhoek", s: "blackVanilla" } ] },
            { q: "The energy you bring into a room:", options: [ { t: "Quiet confidence", s: "whiteOak" }, { t: "Warm and inviting", s: "blackVanilla" }, { t: "Fresh and uplifting", s: "aquaBergamot" }, { t: "Magnetic and bold", s: "copperSantal" }, { t: "Unpredictable", s: "blueLavender" } ] }
        ];
        let currentQuestion = 0;
        let scores = { aquaBergamot:0, blueLavender:0, whiteOak:0, blackVanilla:0, copperSantal:0 };
        let finalMatch = "";

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const target = document.getElementById(viewId);
            if(target) target.classList.add('active');
        }

        function renderQuestion() {
            const data = questionsList[currentQuestion];
            document.getElementById('q-text').innerText = data.q;
            const container = document.getElementById('opts-container');
            container.innerHTML = '';
            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerText = opt.t;
                btn.onclick = () => {
                    scores[opt.s]++;
                    if(currentQuestion < questionsList.length - 1) {
                        currentQuestion++; renderQuestion();
                    } else { calculateResult(); }
                };
                container.appendChild(btn);
            });
        }

        function calculateResult() {
            finalMatch = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            document.getElementById('res-title').innerText = outcomes[finalMatch].t;
            document.getElementById('res-desc').innerText = outcomes[finalMatch].d;
            document.getElementById('res-img').src = outcomes[finalMatch].f;
            switchView('results-view');
            setTimeout(() => { document.getElementById('prize-modal').classList.add('active'); }, 5000);
        }

        function generateQR() {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: `${BASE_URL}/share.html?scent=${finalMatch}`,
                width: 200, height: 200
            });
            document.getElementById('qr-view').classList.add('active');
        }

        document.body.onclick = () => { if(document.getElementById('screensaver').classList.contains('active')) switchView('start-view'); };
        document.getElementById('start-btn').onclick = (e) => { e.stopPropagation(); renderQuestion(); switchView('quiz-view'); };
    </script>
</body>
</html>
