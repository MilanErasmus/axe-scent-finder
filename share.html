<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>I found my AXE Signature Scent at Ultra SA!</title>
    <meta name="title" content="AXE Fine Fragrances x Ultra SA 2026">
    <meta name="description" content="I just matched my energy at the AXE Haus of Fine. Find your signature scent.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://milanerasmus.github.io/axe-scent-finder/">
    <meta property="og:title" content="MY AXE SIGNATURE SCENT: REVEALED">
    <meta property="og:description" content="I found my match at the Haus of Fine! Check out the new AXE Fine Fragrance collection at Ultra SA.">
    <meta property="og:image" content="https://milanerasmus.github.io/axe-scent-finder/holding-screen.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://milanerasmus.github.io/axe-scent-finder/">
    <meta property="twitter:title" content="MY AXE SIGNATURE SCENT: REVEALED">
    <meta property="twitter:description" content="I found my match at the Haus of Fine! Check out the new AXE Fine Fragrance collection at Ultra SA.">
    <meta property="twitter:image" content="https://milanerasmus.github.io/axe-scent-finder/holding-screen.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .bottle { width: 80%; max-height: 400px; object-fit: contain; margin: 2rem 0; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .loader { border: 3px solid #333; border-top: 3px solid #d4af37; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        h2 { font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="loader-box">
        <div class="loader"></div>
        <h2>SYNCING TO SOCIAL...</h2>
    </div>

    <img id="scent-img" class="bottle">

    <script>
        const params = new URLSearchParams(window.location.search);
        const scent = params.get('scent') || 'blackVanilla';
        const plat = params.get('plat') || 'instagram';

        const scentNames = { 
            blackVanilla: "BLACK VANILLA", 
            aquaBergamot: "AQUA BERGAMOT", 
            blueLavender: "BLUE LAVENDER", 
            whiteOak: "WHITE OAK", 
            copperSantal: "COPPER SANTAL" 
        };

        const imgs = { 
            blackVanilla: "vanilla.png", 
            aquaBergamot: "aqua.png", 
            blueLavender: "lavender.png", 
            whiteOak: "oak.png", 
            copperSantal: "copper.png" 
        };

        document.getElementById('scent-img').src = imgs[scent];

        // THE REFINED CAPTION
        const handle = "@axe.sa";
        const tags = "#AxeXUltra26 #SmellFineAllNight #AXEFineFragrances";
        const bodyText = `I just matched with ${scentNames[scent]} at the AXE Haus of Fine! 💎 Enter the grand prize draw here:`;
        const fullPayload = `${bodyText} ${tags} ${handle}`;

        setTimeout(() => {
            if (plat === 'twitter') {
                // X Intent: Text + URL
                window.location.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(fullPayload)}&url=${encodeURIComponent(window.location.origin + window.location.pathname)}`;
            } else if (plat === 'facebook') {
                // FB Sharer: Needs a URL (it pulls text from the OG tags above)
                window.location.href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}&quote=${encodeURIComponent(bodyText)}`;
            } else {
                // INSTAGRAM: Instruction + Deep Link
                alert("SAVE YOUR SCENT IMAGE & TAG @AXE.SA. Entering IG Camera now...");
                window.location.href = "instagram://camera";
            }
        }, 2000);
    </script>
</body>
</html>
