<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXE Social Entry</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h2 { color: #fff; font-weight: 900; text-transform: uppercase; margin-bottom: 0.5rem; }
        p { color: rgba(255,255,255,0.7); font-size: 0.8rem; margin-bottom: 2rem; }
        .bottle { width: 80%; max-height: 400px; object-fit: contain; margin: 2rem 0; }
        .share-btn { display: none; background: #fff; color: #000; padding: 1.2rem; width: 100%; font-weight: 900; text-transform: uppercase; border: none; letter-spacing: 2px; }
        .instruction { color: #d4af37; font-size: 0.7rem; font-weight: 700; margin-top: 1.5rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <h2 id="status">YOUR MATCH IS READY</h2>
    <p>POST TO ENTER THE GRAND PRIZE DRAW</p>
    <img id="scent-img" class="bottle">
    <button id="share-trigger" class="share-btn">POST TO INSTAGRAM</button>
    <div id="guide">
        <p class="instruction">1. WE'VE COPIED YOUR CAPTION</p>
        <p class="instruction">2. SELECT 'FEED' OR 'POST'</p>
        <p class="instruction">3. PASTE CAPTION TO ENTER</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const scent = params.get('scent') || 'blackVanilla';
        const imgs = { blackVanilla:"vanilla.png", aquaBergamot:"aqua.png", blueLavender:"lavender.png", whiteOak:"oak.png", copperSantal:"copper.png" };
        const fileName = imgs[scent];
        document.getElementById('scent-img').src = fileName;
        const caption = `My Fine Fragrance match! #AxeXUltra26 #SmellFineAllNight #AXEFineFragrances @axe.sa`;
        
        function copyCaption() {
            const el = document.createElement('textarea'); el.value = caption; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
        }

        let shareFile = null;
        async function prep() {
            try {
                const response = await fetch(window.location.origin + window.location.pathname.replace('share.html', '') + fileName);
                const blob = await response.blob();
                shareFile = new File([blob], fileName, { type: 'image/png' });
                document.getElementById('share-trigger').style.display = 'block';
                copyCaption();
            } catch (err) { console.error(err); }
        }
        document.getElementById('share-trigger').onclick = async () => {
            if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
                await navigator.share({ files: [shareFile], title: 'AXE Fine Fragrance', text: caption });
            } else { alert("Long-press the image to save and post manually!"); }
        };
        window.onload = prep;
    </script>
</body>
</html>
