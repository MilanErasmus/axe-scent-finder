<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXE Social Entry</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        * { box-sizing: border-box; color: #fff !important; font-family: 'Montserrat', sans-serif; }
        body { background: #000; text-align: center; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h2 { font-weight: 900; text-transform: uppercase; margin-bottom: 0.5rem; }
        p { color: rgba(255,255,255,0.7) !important; font-size: 0.8rem; margin-bottom: 2rem; }
        .bottle { width: 80%; max-height: 400px; object-fit: contain; margin: 2rem 0; }
        .share-btn { display: none; background: #fff !important; color: #000 !important; padding: 1.2rem; width: 100%; font-weight: 900; text-transform: uppercase; border: none; letter-spacing: 2px; }
        .instruction { color: #d4af37 !important; font-size: 0.7rem; font-weight: 700; margin-top: 1.5rem; text-transform: uppercase; }
        
        /* Hidden input for the copy hack */
        #clip-box { position: absolute; left: -9999px; top: 0; }
    </style>
</head>
<body>
    <h2>YOUR MATCH IS READY</h2>
    <p>POST TO ENTER THE GRAND PRIZE DRAW</p>
    <img id="scent-img" class="bottle">
    
    <button id="share-trigger" class="share-btn">POST TO INSTAGRAM</button>
    
    <div id="guide">
        <p class="instruction">1. WE'VE COPIED YOUR CAPTION</p>
        <p class="instruction">2. SELECT 'FEED' OR 'POST'</p>
        <p class="instruction">3. PASTE CAPTION TO ENTER</p>
    </div>

    <textarea id="clip-box" readonly></textarea>

    <script>
        const params = new URLSearchParams(window.location.search);
        const scent = params.get('scent') || 'blackVanilla';
        const imgs = { blackVanilla:"vanilla.png", aquaBergamot:"aqua.png", blueLavender:"lavender.png", whiteOak:"oak.png", copperSantal:"copper.png" };
        const fileName = imgs[scent];
        document.getElementById('scent-img').src = fileName;
        
        const caption = `My Fine Fragrance match! #AxeXUltra26 #SmellFineAllNight #AXEFineFragrances @axe.sa`;
        
        // REPLACED WITH THE HIDDEN ELEMENT HACK (MUCH MORE RELIABLE)
        function forceCopy() {
            const textArea = document.getElementById('clip-box');
            textArea.value = caption;
            
            // Selection logic for iOS/Android
            if (navigator.userAgent.match(/ipad|iphone/i)) {
                const range = document.createRange();
                range.selectNodeContents(textArea);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                textArea.setSelectionRange(0, 999999);
            } else {
                textArea.select();
            }
            
            document.execCommand('copy');
        }

        let shareFile = null;
        async function prep() {
            try {
                const response = await fetch(window.location.origin + window.location.pathname.replace('share.html', '') + fileName);
                const blob = await response.blob();
                shareFile = new File([blob], fileName, { type: 'image/png' });
                document.getElementById('share-trigger').style.display = 'block';
            } catch (err) { console.error(err); }
        }

        document.getElementById('share-trigger').onclick = async () => {
            // STEP 1: FORCE THE COPY IMMEDIATELY
            forceCopy();
            
            // STEP 2: TINY DELAY (300ms) TO ENSURE THE CLIPBOARD LOCKS
            setTimeout(async () => {
                if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
                    try {
                        // LINK-KILL: Share ONLY the file
                        await navigator.share({ files: [shareFile] });
                    } catch (err) { console.log("Share cancelled"); }
                } else { 
                    alert("Long-press the image to save and post manually!"); 
                }
            }, 300);
        };
        
        window.onload = prep;
    </script>
</body>
</html>
